# Publishes the static frontend/ folder to GitHub Pages on every push to main.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Optional: set repository variable SIGN_API_BASE (Settings > Secrets and variables > Actions > Variables)
      # to the public HTTPS address of the backend instead of editing frontend/config.js.
      - name: Write backend address
        if: ${{ vars.SIGN_API_BASE != '' }}
        run: |
          printf "window.SIGN_API_BASE = window.SIGN_API_BASE ?? '%s';\n" "${{ vars.SIGN_API_BASE }}" > frontend/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
